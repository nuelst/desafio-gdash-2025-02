services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: weather-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: weather-dashboard
    networks:
      - weather-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: weather-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - weather-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/weather-dashboard
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - DEFAULT_USER_EMAIL=admin@root.com
      - DEFAULT_USER_PASSWORD=root123
      - ADMIN_EMAIL=admin@root.com
      - ADMIN_PASSWORD=root123
      - FRONTEND_URL=http://localhost:5173
      - GEONAMES_USERNAME=demo
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - weather-network

  # Python Service (Weather Collector)
  python-collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: weather-python-collector
    environment:
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=weather-data
      - 'WEATHER_LOCATIONS=[{"name": "São Paulo, BR", "latitude": -23.5505, "longitude": -46.6333}, {"name": "Luanda, Angola", "latitude": -8.8383, "longitude": 13.2344}]'
      - COLLECTION_INTERVAL_SECONDS=3600
      - OPEN_METEO_URL=https://api.open-meteo.com/v1/forecast
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - weather-network
    # volumes:
    #   - ./collector:/app
    # Comentado para Railway - não é necessário em produção

    # Go Worker
  go-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: weather-go-worker
    environment:
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=weather-data
      - NESTJS_API_URL=http://api:3000
      - RETRY_ATTEMPTS=3
      - RETRY_DELAY=5
    depends_on:
      - rabbitmq
      - api
    networks:
      - weather-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
    container_name: weather-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - weather-network

networks:
  weather-network:
    driver: bridge

volumes:
  mongodb_data:
  rabbitmq_data:



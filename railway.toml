# Railway Configuration
#
# ⚠️ IMPORTANTE: Este projeto tem múltiplos serviços e NÃO pode ser deployado
# como um único serviço. Você DEVE criar serviços separados no Railway.
#
# O Railway não suporta deploy direto de Docker Compose com múltiplos serviços.
# O Railpack (detector automático) falhará porque há múltiplas linguagens.
#
# ✅ SOLUÇÃO: Crie serviços separados no dashboard do Railway:
#
# 1. Serviço "api":
#    - Root Directory: backend
#    - Dockerfile Path: Dockerfile
#
# 2. Serviço "frontend":
#    - Root Directory: frontend
#    - Dockerfile Path: Dockerfile
#
# 3. Serviço "python-collector":
#    - Root Directory: collector
#    - Dockerfile Path: Dockerfile
#
# 4. Serviço "go-worker":
#    - Root Directory: worker
#    - Dockerfile Path: Dockerfile
#
# 📖 Veja RAILWAY_SETUP.md para instruções detalhadas passo a passo.
#
# Este arquivo pode ser deletado ou ignorado - não é necessário para o deploy.

